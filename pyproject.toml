[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ShellParser"
version = "1.2.1"
description = "AI-augmented shell script component manager: split, replace, and document shell functions safely."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["shell", "parser", "CLI", "CIAO", "ChronicleLogger", "components"]

dependencies = [
    "ChronicleLogger>=1.3.1",
    "StateLogic>=1.2.0",
]

# Official project links (git remote SSOT: cloudgen/ShellParser)
[project.urls]
Homepage = "https://github.com/cloudgen/ShellParser"
Repository = "https://github.com/cloudgen/ShellParser"
Issues = "https://github.com/cloudgen/ShellParser/issues"

# Primary console name matches help/README; hyphenated alias for older installs
[project.scripts]
shellparser = "ShellParser.cli:main"
shell-parser = "ShellParser.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
