[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ShellParser"
version = "1.0.0"
description = "A robust command-line tool for managing multiple projects that follow a prefix-suffix naming convention."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["logging", "sudo", "chronicle", "example"]

dependencies = [
    "ChronicleLogger>=1.3.1",
]

# Official project links (this is what shows on PyPI!)
[project.urls]
Homepage = "https://github.com/Wilgat/ShellParser"
Repository = "https://github.com/Wilgat/ShellParser"
Issues = "https://github.com/Wilgat/ShellParser/issues"

# This makes `shell-parser` command available after pip install
[project.scripts]
shell-parser = "ShellParser.cli:main"
